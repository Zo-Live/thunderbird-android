---
name: Sync - Upstream

on:
  schedule:
    # Daily at 20:17 UTC (04:17 Asia/Shanghai).
    - cron: '17 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Merge upstream/main
        env:
          UPSTREAM_REPOSITORY: thunderbird/thunderbird-android
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch --no-tags upstream main

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "main is already up to date with upstream/main."
            exit 0
          fi

          if ! git merge --no-edit -m "chore: sync upstream/main" upstream/main; then
            echo "::error::Failed to merge upstream/main into main. Resolve the conflict locally and push main."
            git merge --abort || true
            exit 1
          fi

          git push origin HEAD:main
